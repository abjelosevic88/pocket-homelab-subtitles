name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Engine tests
        run: python -m unittest discover -s engine -v
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-subtitles ./cmd/pocket-subtitles
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pst DEMO_DATA=true AUTH_MODE=none LEGACY_API=open ./pocket-subtitles &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/overview | grep -q '"processed"'
          curl -fsS http://localhost:8080/api/v1/widget | grep -q '"status"'
          curl -fsS 'http://localhost:8080/nudge/files?q=dark&limit=3' | grep -q '"nudged_ms"'
          curl -fsS http://localhost:8080/ | grep -q '"status"'
          curl -fsS -H 'Accept: text/html' http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-subtitles:pr
