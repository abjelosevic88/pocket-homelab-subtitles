# Pocket Subtitles — subtitle timing that fits the video, for the whole library. Go + SQLite.
#
# With its own Bazarr:  COMPOSE_PROFILES=bazarr docker compose up -d
#   (or COMPOSE_PROFILES=bazarr in .env, as in .env.example and Pocket Core's installer)
#   starts the app and Bazarr over one media folder (MEDIA_FOLDER, default ./media). Pocket
#   Subtitles takes Bazarr's API key by itself. Bazarr still needs setting up once in its own
#   page (port 6767): connect Sonarr and Radarr, pick languages and subtitle providers.
# With your Bazarr:     BAZARR_URL=http://your-bazarr:6767 docker compose up -d
#   starts only the app; set Bazarr's API key under Settings → Integrations.
services:
  pocket-subtitles:
    image: ghcr.io/abjelosevic88/pocket-homelab-subtitles:latest
    container_name: pocket-subtitles
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}                      # the nightly sweep runs on this clock
      # The library folders, as mounted below. Mount them at the SAME paths
      # Bazarr uses, or set a path mapping under Settings → Integrations.
      MEDIA_DIRS: /media/shows,/media/movies
      # Set both to skip the first-run setup screen and create the admin directly:
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # SECURE_COOKIES: "true"           # behind HTTPS
      BAZARR_URL: ${BAZARR_URL:-http://bazarr:6767}   # the Bazarr below, or yours; also settable in the UI
      # BAZARR_API_KEY: ${BAZARR_API_KEY}   # not needed for the Bazarr below (read from its config)
      BAZARR_CONFIG_FILE: /bazarr/config/config.yaml
      # JELLYFIN_URL: http://jellyfin:8096
      # JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
    volumes:
      - ./data:/data                      # database, measurement cache, original backups
      - ${MEDIA_FOLDER:-./media}:/media   # read-write: synced subtitles are written next to the videos
      - ${BAZARR_CONFIG_DIR:-./bazarr}:/bazarr:ro   # the Bazarr below: its API key
    # Run as the user that owns your media files:
    user: "1000:1000"
    depends_on:
      bazarr:
        condition: service_started
        required: false   # only with the bazarr profile

  # Bazarr, from LinuxServer's image (the "bazarr" profile). It downloads subtitles into the same
  # media folder, at the same /media paths, so nothing needs mapping.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: pocket-subtitles-bazarr
    profiles: [bazarr]
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
    volumes:
      - ${BAZARR_CONFIG_DIR:-./bazarr}:/config
      - ${MEDIA_FOLDER:-./media}:/media
    ports:
      - "6767:6767"   # Bazarr's own page: set it up once (Sonarr, Radarr, languages, providers)
